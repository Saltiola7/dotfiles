# Extend Fedora defaults; keep its locking, portals, bar and session integration.
# Super (Mod4, normally Command in Parallels) replaces host Alt for focus/move.
# Workspaces retain Fedora Super+number / Super+Shift+number, not the host chord.
# Parallels key forwarding and physical Colemak layout need operator verification.
unbindsym Mod4+Return
bindsym Mod4+Return exec kitty

# Colemak down conflicts with Fedora layout and logout; remove both first.
unbindsym Mod4+e
unbindsym Mod4+Shift+e
bindsym Mod4+n focus left
bindsym Mod4+e focus down
bindsym Mod4+i focus up
bindsym Mod4+o focus right
bindsym Mod4+Shift+n move left
bindsym Mod4+Shift+e move down
bindsym Mod4+Shift+i move up
bindsym Mod4+Shift+o move right

bindsym Mod4+period layout toggle split
bindsym Mod4+comma layout toggle all
bindsym Mod4+Tab workspace back_and_forth
bindsym Mod4+Ctrl+minus resize shrink width 50 px
bindsym Mod4+Ctrl+equal resize grow width 50 px
mode "resize" {
    bindsym n resize shrink width 10 px
    bindsym e resize grow height 10 px
    bindsym i resize shrink height 10 px
    bindsym o resize grow width 10 px
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
# Fedora Super+r enters resize mode. No emulation of AeroSpace tree operations.
# Logout remains available from the session menu; no one-chord logout is added.

# Catppuccin Mocha (https://github.com/catppuccin/sway)
set $ctp_rosewater #f5e0dc
set $ctp_flamingo #f2cdcd
set $ctp_pink #f5c2e7
set $ctp_mauve #cba6f7
set $ctp_red #f38ba8
set $ctp_maroon #eba0ac
set $ctp_peach #fab387
set $ctp_yellow #f9e2af
set $ctp_green #a6e3a1
set $ctp_teal #94e2d5
set $ctp_sky #89dceb
set $ctp_sapphire #74c7ec
set $ctp_blue #89b4fa
set $ctp_lavender #b4befe
set $ctp_text #cdd6f4
set $ctp_subtext1 #bac2de
set $ctp_subtext0 #a6adc8
set $ctp_overlay2 #9399b2
set $ctp_overlay1 #7f849c
set $ctp_overlay0 #6c7086
set $ctp_surface2 #585b70
set $ctp_surface1 #45475a
set $ctp_surface0 #313244
set $ctp_base #1e1e2e
set $ctp_mantle #181825
set $ctp_crust #11111b

client.focused $ctp_lavender $ctp_base $ctp_text $ctp_rosewater $ctp_lavender
client.focused_inactive $ctp_overlay0 $ctp_base $ctp_text $ctp_rosewater $ctp_overlay0
client.unfocused $ctp_surface1 $ctp_base $ctp_text $ctp_rosewater $ctp_surface1
client.urgent $ctp_red $ctp_mantle $ctp_text $ctp_rosewater $ctp_red

default_border pixel 3
default_floating_border pixel 3

# Solid Mocha background replaces the Fedora default wallpaper.
output * bg #1e1e2e solid_color

# The Fedora bar is waybar; its theme lives in ~/.config/waybar.
