[global]
    server role = standalone server
    security = user
    map to guest = Never
    server min protocol = SMB2
    smb ports = 445
    interfaces = lo
    bind interfaces only = yes
    disable netbios = yes
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

[Shared]
    path = @HOME@/Shared
    valid users = @OWNER@
    guest ok = no
    read only = no
    create mask = 0600
    directory mask = 0700
