# Deskflow 1.27 general settings (deskflow-core server -s).
# Screens are defined here as [computer_<name>] sections since 1.27.0.
# protocol=synergy is REQUIRED for waynergy clients (barrier is the default).
[core]
coreMode=2
computerName=try-omarchy
port=24800

[log]
# DEBUG during the pilot for transition/clipboard visibility; lower at promotion.
level=DEBUG

[security]
tlsEnabled=true
# Pilot: no client fingerprint pinning (clients trust-on-first-use).
# Revisit before the guest becomes LAN-reachable via bridged networking.
checkPeerFingerprints=false

[server]
externalConfig=true
externalConfigFile=/home/tis/.config/deskflow/deskflow.conf
protocol=synergy
enableClipboard=true
relativeMouseMoves=true

[computer_try-omarchy]
name=try-omarchy

[computer_omarchy-5849dc63]
name=omarchy-5849dc63

[computer_mbp-omarchy]
name=mbp-omarchy
