# Deskflow 1.27 external server config: LINKS ONLY.
# Managed by chezmoi; read via externalConfigFile in deskflow-core.conf.
# Since deskflow 1.27.0 screens/aliases moved OUT of this file into the
# general settings (deskflow-core.conf [computer_<name>] sections); a
# screens section here is ignored with a warning and its names become
# "unknown computer name" errors in links.
section: links
	try-omarchy:
		left(0,100) = omarchy-5849dc63(0,100)
		right(0,100) = mbp-omarchy(0,100)
	omarchy-5849dc63:
		right(0,100) = try-omarchy(0,100)
	mbp-omarchy:
		left(0,100) = try-omarchy(0,100)
end
