# Deskflow server layout — omarchy-try desk-sharing pilot (2026-11-16).
# Managed by chezmoi; the deskflow server reads this at start.
# Screen names must match waynergy client identities exactly:
#   omarchy-5849dc63 = hp-omarchy desktop
#   mbp-omarchy     = M1 MacBook
# The server's own name is forced to "try-omarchy" on the command line
# (the guest hostname is "omarchy", which would collide conceptually
# with the HP client).
section: screens
	try-omarchy:
	omarchy-5849dc63:
	mbp-omarchy:
end

section: links
	try-omarchy:
		left(0,100) = omarchy-5849dc63(0,100)
		right(0,100) = mbp-omarchy(0,100)
	omarchy-5849dc63:
		right(0,100) = try-omarchy(0,100)
	mbp-omarchy:
		left(0,100) = try-omarchy(0,100)
end

section: options
	heartbeat = 5000
	clipboardSharing = true
	relativeMouseMoves = true
end
