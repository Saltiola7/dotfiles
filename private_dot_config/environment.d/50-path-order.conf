# ~/.local/bin must precede /usr/share/omarchy/bin so user shims can
# intercept omarchy tooling (e.g. the fast agents-panel usage shim, which
# replaces a collector that parses a 100 GB database on every refresh).
# The omarchy session bootstrap prepends its bin dir at login; this file
# is applied after, restoring user precedence while keeping omarchy tools
# ahead of system paths.
PATH=/home/tis/.local/bin:/usr/share/omarchy/bin:/home/tis/.local/share/mise/command-wrappers/bin:/home/tis/.local/share/mise/shims:/usr/lib/try-omarchy/bin:/usr/local/sbin:/usr/local/bin:/usr/bin:/usr/bin/site_perl:/usr/bin/vendor_perl:/usr/bin/core_perl
