{{- $private := eq .policy "tailscale-only" -}}
{{- if not (or $private (eq .policy "private-lan-and-tailscale")) -}}
{{- fail "Unsupported Samba policy" -}}
{{- end -}}
{{- $access := list (printf "valid users = %s" .owner) "guest ok = no" "read only = no" -}}
{{- if not $private -}}
{{- $access = list "browseable = yes" (index $access 2) (index $access 1) (index $access 0) -}}
{{- end -}}
[global]
    server role = standalone server
    security = user
    map to guest = Never
    server min protocol = SMB2
    smb ports = 445
{{ if $private }}    interfaces = lo
    bind interfaces only = yes
{{ end }}    disable netbios = yes
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

[Shared]
    path = {{ .home }}/Shared
{{ range $access }}    {{ . }}
{{ end }}    create mask = 0600
    directory mask = 0700
