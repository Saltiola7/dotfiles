name: remote-workspace-ubi

on:
  pull_request:
    paths:
      - ".github/workflows/remote-workspace-ubi.yml"
      - ".chezmoi*"
      - "private_dot_config/yazi/**"
      - "run_onchange_install-remote-workspace-yazi.sh.tmpl"
      - "run_onchange_after_install-yazi-flavor.sh.tmpl"
      - "tests/test_remote_workspace_profile.py"
      - "tests/remote_workspace_profile_smoke.sh"
      - "docs/specs/remote_workspace_profile/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: registry.access.redhat.com/ubi10/ubi
    env:
      DOTFILES_AI_SOURCE: ${{ github.workspace }}/shared
    steps:
      - run: dnf -qy install ca-certificates curl git gzip python3 tar unzip diffutils findutils lsof xz
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: owner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Saltiola7/dotfiles-ai
          # Reviewed RRW-002 candidate; replace with its full merge SHA before
          # final paired qualification. This candidate is not rollout authority.
          ref: ed0f0cd628e4badd45595df1371290b885768aa5
          path: shared
          persist-credentials: false
      - name: Qualify disjoint installation, idempotency and rollback
        shell: bash
        run: |
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE
          bash owner/tests/remote_workspace_profile_smoke.sh "$GITHUB_WORKSPACE/owner" "$DOTFILES_AI_SOURCE"
