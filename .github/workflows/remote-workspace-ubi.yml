name: remote-workspace-ubi

on:
  pull_request:
    paths:
      - ".github/workflows/remote-workspace-ubi.yml"
      - ".chezmoi*"
      - "private_dot_config/yazi/**"
      - "private_dot_config/git/**"
      - "private_dot_config/nvim/**"
      - "private_dot_config/remote-workspace/**"
      - "dot_bashrc.d/40-remote-workspace.sh"
      - "dot_local/bin/executable_remote-workspace-*"
      - "run*remote-workspace*.tmpl"
      - "tests/test_remote_workspace_*.py"
      - "run_onchange_install-remote-workspace-yazi.sh.tmpl"
      - "run_onchange_after_install-yazi-flavor.sh.tmpl"
      - "tests/test_remote_workspace_profile.py"
      - "tests/remote_workspace_profile_smoke.sh"
      - "docs/specs/remote_workspace_profile/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: registry.access.redhat.com/ubi10/ubi
    steps:
      - run: dnf -qy install ca-certificates curl git gzip python3 tar unzip diffutils findutils lsof xz gcc gcc-c++ make
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: owner
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Saltiola7/dotfiles-ai
          # Verified merged RRW-007E foundation; qualify this exact source pair.
          ref: 83137ab69d3ac66f3ddd2f88ae208e818a4dfb82
          path: shared
          persist-credentials: false
      - name: Qualify disjoint installation, idempotency and rollback
        shell: bash
        run: |
          unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE
          export DOTFILES_AI_SOURCE="$GITHUB_WORKSPACE/shared"
          bash owner/tests/remote_workspace_profile_smoke.sh "$GITHUB_WORKSPACE/owner" "$DOTFILES_AI_SOURCE"
