name: Tests

# Keep this workflow in the path filter so CI fixes validate themselves.

on:
  push:
    paths:
      - ".github/workflows/test.yml"
      - "private_dot_config/kitty/**"
      - "dot_local/bin/**"
      - "tests/**"
      - "pyproject.toml"
      - "dot_agents/skills/**"
      - "private_dot_config/opencode/**"
      - "docs/specs/dbsctr_v3_lifecycle/**"
      - ".chezmoiignore"
      - ".chezmoiremove"
      - "Brewfile"
      - "dot_bash_profile.tmpl"
      - "dot_bashrc.tmpl"
      - "dot_common_profile.tmpl"
      - "dot_xonshrc.tmpl"
      - "private_dot_config/atuin/**"
      - "private_dot_config/atuin-server/**"
      - "run_onchange_install-lmsh-terminal.sh.tmpl"
      - "run_onchange_install-remote-workspace-yazi.sh.tmpl"
      - "run_onchange_after_install-yazi-flavor.sh.tmpl"
      - "private_dot_config/yazi/**"
      - "docs/specs/shell_auth_startup/**"
      - "docs/specs/remote_workspace_profile/**"
  pull_request:
    paths:
      - ".github/workflows/test.yml"
      - "private_dot_config/kitty/**"
      - "dot_local/bin/**"
      - "tests/**"
      - "pyproject.toml"
      - "dot_agents/skills/**"
      - "private_dot_config/opencode/**"
      - "docs/specs/dbsctr_v3_lifecycle/**"
      - ".chezmoiignore"
      - ".chezmoiremove"
      - "Brewfile"
      - "dot_bash_profile.tmpl"
      - "dot_bashrc.tmpl"
      - "dot_common_profile.tmpl"
      - "dot_xonshrc.tmpl"
      - "private_dot_config/atuin/**"
      - "private_dot_config/atuin-server/**"
      - "run_onchange_install-lmsh-terminal.sh.tmpl"
      - "run_onchange_install-remote-workspace-yazi.sh.tmpl"
      - "run_onchange_after_install-yazi-flavor.sh.tmpl"
      - "private_dot_config/yazi/**"
      - "docs/specs/shell_auth_startup/**"
      - "docs/specs/remote_workspace_profile/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install chezmoi
        run: |
          curl -fsSL https://github.com/twpayne/chezmoi/releases/download/v2.69.4/chezmoi_2.69.4_linux_amd64.tar.gz -o /tmp/chezmoi.tgz
          echo "5054cf09cb2993725f525c8bb6ec3ff8625489ecfc061e019c17e737e7c7057b  /tmp/chezmoi.tgz" | sha256sum -c -
          tar -xzf /tmp/chezmoi.tgz -C /tmp chezmoi
          sudo install -m 0755 /tmp/chezmoi /usr/local/bin/chezmoi
      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --group test
      - name: Run tests
        run: uv run --group test pytest tests/ -v
