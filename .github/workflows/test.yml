name: Tests

# Keep this workflow in the path filter so CI fixes validate themselves.

on:
  push:
    paths:
      - ".github/workflows/test.yml"
      - "private_dot_config/kitty/**"
      - "dot_local/bin/**"
      - "tests/**"
      - "pyproject.toml"
      - "dot_agents/skills/**"
      - "private_dot_config/opencode/**"
      - "docs/specs/dbsctr_v3_lifecycle/**"
      - ".chezmoiignore"
      - ".chezmoiremove"
  pull_request:
    paths:
      - ".github/workflows/test.yml"
      - "private_dot_config/kitty/**"
      - "dot_local/bin/**"
      - "tests/**"
      - "pyproject.toml"
      - "dot_agents/skills/**"
      - "private_dot_config/opencode/**"
      - "docs/specs/dbsctr_v3_lifecycle/**"
      - ".chezmoiignore"
      - ".chezmoiremove"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --group test
      - name: Run tests
        run: uv run --group test pytest tests/ -v
